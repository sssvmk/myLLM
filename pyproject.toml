[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation_llm"
version = "0.1.0"
description = "A split-out, bug-fixed, multi-source version of MyLLM"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "pyspark",
    "tiktoken",
    "pyarrow",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
